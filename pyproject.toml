[project]
name = "manage-family-api"
version = "0.1.0"
description = "Household Manager API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "supabase>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dateutil>=2.9.0",
    "recurring-ical-events>=3.3.0",
    "icalendar>=6.1.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
