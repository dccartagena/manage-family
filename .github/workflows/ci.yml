name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [main, production]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # API Jobs
  # ============================================================================
  api-lint:
    name: API — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ".[dev]"

      - name: Ruff & Black
        run: ruff check . && black --check .

  api-test:
    name: API — test
    runs-on: ubuntu-latest
    needs: [api-lint]
    env:
      SUPABASE_JWT_SECRET: test-jwt-secret-ci
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      SCHEDULER_SECRET: placeholder
      APP_TIMEZONE: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ".[dev]"

      - name: pytest
        run: pytest --tb=short

  # ============================================================================
  # Web Jobs
  # ============================================================================
  web-lint:
    name: Web — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint & Prettier
        run: npm run lint && npx prettier --check .

  web-build:
    name: Web — build
    runs-on: ubuntu-latest
    needs: [web-lint]
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  web-test:
    name: Web — test
    runs-on: ubuntu-latest
    needs: [web-build]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: vitest
        run: npx vitest run
